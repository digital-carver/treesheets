id = "core-model"
title = "Cells, grids, and selections"
category = "core concepts"
page = "index"

[verification]
level = "implementation_verified"
text = "Verified from the selection, grid, and cell model code."

[behavior]
summary = """
A TreeSheets document starts from a root cell that can contain a grid. Each grid contains cells and remembers layout details such as its size, column widths, orientation, border appearance, and fold state. A selection can cover cells, sit on a grid line, or become a text cursor inside one cell.
"""
context = """
Most commands need an active grid selection. Single-cell commands require one selected cell or a grid-line selection that can be expanded into a neighboring cell; whole-grid commands usually require the current selection to cover the grid.
"""
effects = """
Selection state can enter text edit mode, exit text edit mode, expand to all cells, or be reassigned to a parent or child grid.
"""
edge_cases = """
If a command needs a selected grid, a non-thin selection, or exactly one cell and the current selection cannot provide it, TreeSheets reports that requirement instead of changing the document.
"""
quirks = """
The same visible selection system covers three modes: rectangular cell selections, grid-line positions used for insertion or deletion, and text cursors inside a cell.
"""

