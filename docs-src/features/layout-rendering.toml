id = "layout-rendering"
title = "Layout direction and render styles"
category = "grids"
page = "grids"

[[commands]]
name = "Vertical/horizontal layout with render style"
menu_path = "Edit > Layout & Render Style"
shortcut = "Alt+1..6 on non-macOS, Ctrl+1..6 on macOS"
command_id = "A_V_GS/A_V_BS/A_V_LS/A_H_GS/A_H_BS/A_H_LS"

[[commands]]
name = "Render style only"
menu_path = "Edit > Layout & Render Style"
shortcut = "Alt+7..9 on non-macOS, Ctrl+7..9 on macOS"
command_id = "A_GS/A_BS/A_LS"

[[commands]]
name = "Toggle vertical layout"
menu_path = "Edit > Layout & Render Style"
shortcut = "Alt+0 on non-macOS, Ctrl+0 on macOS"
command_id = "A_TEXTGRID"

[verification]
level = "implementation_verified"
text = "Verified from platform-specific menu labels and layrender implementation."

[behavior]
summary = """
Layout commands set selected cells or selected grids to vertical/horizontal text-and-grid layout and grid, bubble-hierarchy, or line render styles. Render-style-only commands preserve orientation while changing draw style.
"""
context = """
The selected grid must not be a thin selection. Render-style-only commands set the containing grid draw style when the whole grid is selected.
"""
effects = """
Commands add undo, call SetGridTextLayout, reset children, and refresh the canvas.
"""
edge_cases = """
Thin selections are rejected with the normal no-thin-selection message.
"""
quirks = """
Shortcut labels deliberately use Ctrl on macOS and Alt elsewhere.
"""

