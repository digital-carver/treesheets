id = "lobster-scripting-api"
title = "TreeSheets functions available to Lobster scripts"
category = "scripting"
page = "scripting"

[evidence]
level = "docs_supported"
text = "Supported by the bundled scripting reference and script interface declarations; individual scripts should still be tested in a Lobster-enabled build."

[behavior]
summary = """
TreeSheets exposes a `ts` namespace to Lobster scripts. Scripts can navigate the document, inspect the current selection, read and write cell text and notes, create grids, insert rows and columns, delete ranges, set colors and style bits, change relative text size and column width, filter text, set status messages, ask the user for filenames, inspect filenames and edit timestamps, and attach or remove images.
"""
context = """
The API acts on a script-side current cell. Scripts start at the document root, can jump to the current view or user selection, and then navigate parent/child relationships.
"""
effects = """
Mutating API calls change the open TreeSheets document through the same document model used by the GUI. Script execution status or errors are surfaced through TreeSheets' script runner.
"""
edge_cases = """
These functions are available only when TreeSheets is built with Lobster support and the script is run through the TreeSheets script system.
"""
quirks = """
The scripting reference is generated by the Lobster compiler tooling, but it is an existing bundled TreeSheets reference and is treated here as documentation evidence, not generated machinegen evidence.
"""

