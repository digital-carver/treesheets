id = "scripting-evaluation"
title = "Program evaluation and Lobster scripts"
category = "scripting"
page = "scripting"

[[commands]]
name = "Run"
menu_path = "Program > Run"
shortcut = "Ctrl+Alt+F5"
command_id = "wxID_EXECUTE"

[[commands]]
name = "Mark as"
menu_path = "Program > Mark as"
shortcut = "Ctrl+Alt+D/O/A/R/./,"
command_id = "A_MARKDATA/A_MARKCODE/A_MARKVARD/A_MARKVARU/A_MARKVIEWH/A_MARKVIEWV"

[[commands]]
name = "Add/remove Lobster script"
menu_path = "Script"
shortcut = "Ctrl+Alt+L, Ctrl+Shift+Alt+L"
command_id = "A_ADDSCRIPT/A_DETSCRIPT"

[evidence]
level = "code_verified"
text = "Verified from Program menu definitions, Lobster menu setup, evaluator dispatch, script interface code, and the generated scripting reference."

[behavior]
summary = """
Program > Run evaluates the root cell as a TreeSheets program. Mark commands label selected cells as data, operation, variable assign/read, or horizontal/vertical views for the evaluator. When Lobster support is enabled, TreeSheets adds a Script menu that can run bundled or user-added `.lobster` scripts.
"""
context = """
Run acts on the document root. Mark commands require an active grid selection. Script menu commands are available only in builds compiled with Lobster support.
"""
effects = """
Run is undoable and refreshes the sheet after evaluation. Mark commands are also undoable and change how the evaluator interprets the selected cells.
"""
edge_cases = """
Script menu entries and tag popup entries share the same menu dispatch path, so script commands are handled before ordinary document-editing commands.
"""
quirks = """
Script menu behavior is source-verified, but it appears in the application only when Lobster support is enabled at build time.
"""

