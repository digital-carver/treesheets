id = "native-file-format"
title = "Native .cts file contents"
category = "import/export"
page = "import_export"

[evidence]
level = "docs_supported"
text = "Supported by the bundled file-format specification and save/load implementation references."

[behavior]
summary = """
The native `.cts` file stores the TreeSheets document structure, selection size, zoom level, embedded images, root cell, cell text state, notes, optional nested grids, grid dimensions, column widths, layout direction, and folded state.
"""
context = """
This is mainly useful for users who care about portability, backups, or external import/export tools. Normal editing should use TreeSheets' Save, Open, Import, and Export commands.
"""
effects = """
Because images and nested grids are stored in the native file, a saved `.cts` can preserve much more TreeSheets-specific structure than CSV or plain text exports.
"""
edge_cases = """
The checked-in file-format note describes version 23, while the implementation may have evolved. Treat it as a helpful compatibility reference rather than a complete current reverse-engineering manual.
"""
quirks = """
The file-format page is intentionally technical; this user reference translates it only into the visible things a saved file preserves.
"""

