id = "import-export"
title = "Import and export current views"
category = "import/export"
page = "import_export"

[[commands]]
name = "Export view as"
menu_path = "File > Export view as"
shortcut = ""
command_id = "A_EXPXML/A_EXPHTMLT/A_EXPHTMLTE/A_EXPHTMLB/A_EXPHTMLO/A_EXPTEXT/A_EXPCSV/A_EXPIMAGE/A_EXPSVG"

[[commands]]
name = "Import from"
menu_path = "File > Import from"
shortcut = ""
command_id = "A_IMPXML/A_IMPXMLA/A_IMPTXTI/A_IMPTXTC/A_IMPTXTS/A_IMPTXTT"

[evidence]
level = "code_verified"
text = "Verified from File menu definitions, import/export code paths, tutorial guidance, history notes, and the file-format reference."

[behavior]
summary = """
Export writes the current view as XML, styled HTML tables, HTML with images, bullet-list HTML, outline HTML, indented text, CSV, PNG, or SVG. Import can load XML, XML with attributes, indented text, comma CSV, semicolon CSV, and tab-delimited text.
"""
context = """
Export uses the view you are currently looking at, so zooming into a grid changes what is exported. Import opens files and builds a new document from parsed content.
"""
effects = """
Successful import opens parsed content as a document. HTML with images writes companion image files beside the exported HTML.
"""
edge_cases = """
CSV export refuses non-flat grids and suggests zooming to the desired grid or using Flatten. Import failure shows an error message.
"""
quirks = """
XML export can round-trip TreeSheets structure, while CSV export is intentionally limited to flat grids.
"""

