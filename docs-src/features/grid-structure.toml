id = "grid-structure"
title = "Create, fold, wrap, transpose, flatten, and hierarchify grids"
category = "grids"
page = "grids"

[[commands]]
name = "Insert New Grid / NxN Grid"
menu_path = "Edit"
shortcut = "Ins or Ctrl+G; Ctrl+Shift+Enter"
command_id = "A_ENTERGRID/A_ENTERGRIDN"

[[commands]]
name = "Wrap in new parent"
menu_path = "Edit"
shortcut = "F9"
command_id = "A_WRAP"

[[commands]]
name = "Fold / Fold All / Unfold All"
menu_path = "Edit"
shortcut = "F10 or Ctrl+F10; Ctrl+Shift+F10; Ctrl+Alt+F10"
command_id = "A_FOLD/A_FOLDALL/A_UNFOLDALL"

[[commands]]
name = "Transpose / Hierarchify / Flatten"
menu_path = "Edit > Grid Reorganization"
shortcut = "Ctrl+Shift+T for transpose"
command_id = "A_TRANSPOSE/A_HIFY/A_FLATTEN"

[verification]
level = "implementation_verified"
text = "Verified from menu entries and grid-structure command branches."

[behavior]
summary = """
Grid creation adds a subgrid to one selected cell or enters an existing one. Wrap creates a new parent hierarchy around the selection. Folding toggles whether selected subgrids are displayed. Transpose changes grid orientation, Hierarchify converts a table-like grid into hierarchy, and Flatten converts nested hierarchy into a flat grid sized by depth and leaves.
"""
context = """
Creation needs one expandable cell. Transpose rejects thin selections. Hierarchify requires a selected cell or whole grid with a table-like grid. Flatten requires a grid and can operate on the selected cell or all selected grid.
"""
effects = """
Structural commands add undo, mutate grid ownership or layout, reset child layout caches, rewrite selection, and refresh the canvas.
"""
edge_cases = """
The root grid cannot be removed by grid deletion. Hierarchify refuses grids whose cells already contain subgrids.
"""
quirks = """
Fold state is saved in TreeSheets XML, so folded grids remain folded when the structure is exported and reimported.
"""

