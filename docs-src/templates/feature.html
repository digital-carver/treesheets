<article class="feature" id="{{ id }}">
  <div class="feature-head">
    <h2>{{ title }}</h2>
    <span class="badge badge-{{ verification_level }}">{{ verification_label }}</span>
  </div>
  {{ behavior_sections }}
  {{ command_table }}
  <p class="verification">{{ verification_text }}</p>
  {{ related_links }}
  {{ source_refs }}
</article>
