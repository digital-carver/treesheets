<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} - {{ site_title }}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #171b22;
      --panel-2: #1d232d;
      --text: #e5e9f0;
      --muted: #9ba7b6;
      --faint: #6f7a89;
      --border: #2b3440;
      --link: #91c9ff;
      --green: #587d64;
      --teal: #486f7e;
      --amber: #7d6845;
      --violet: #68617d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .layout {
      display: grid;
      grid-template-columns: minmax(210px, 260px) minmax(0, 1fr);
      min-height: 100vh;
    }
    nav {
      border-right: 1px solid var(--border);
      background: #0f1116;
      padding: 28px 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    nav .brand {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    nav a {
      display: block;
      padding: 7px 9px;
      border-radius: 6px;
      color: var(--muted);
    }
    nav a.active {
      background: var(--panel-2);
      color: var(--text);
    }
    main {
      max-width: 1120px;
      width: 100%;
      padding: 42px 48px 72px;
    }
    header.page-header {
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 22px;
    }
    h1 {
      font-size: 34px;
      line-height: 1.2;
      margin: 0 0 10px;
      letter-spacing: 0;
    }
    h2 {
      font-size: 23px;
      line-height: 1.3;
      margin: 0;
      letter-spacing: 0;
    }
    h3 {
      font-size: 16px;
      margin: 22px 0 8px;
      color: #cbd4df;
      letter-spacing: 0;
    }
    .meta, .notice, .description, .verification, .footnotes {
      color: var(--muted);
    }
    .notice { margin-top: 5px; font-size: 14px; }
    .feature {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin: 22px 0;
    }
    .feature-head {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 3px 10px;
      color: #f1f5f9;
      font-size: 12px;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,.08);
    }
    .badge-implementation_verified { background: var(--green); }
    .badge-ui_verified { background: var(--teal); }
    .badge-docs_history_verified { background: var(--amber); }
    .badge-source_not_found, .badge-needs_human_check { background: var(--violet); }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0 20px;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      vertical-align: top;
      text-align: left;
    }
    th {
      color: #cbd4df;
      font-weight: 650;
    }
    code {
      background: #0d1015;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 5px;
      color: #dbeafe;
    }
    .source-refs {
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
    }
    .footnotes {
      border-top: 1px solid var(--border);
      margin-top: 34px;
      padding-top: 16px;
      font-size: 14px;
    }
    .audit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .audit-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    ul { padding-left: 22px; }
    @media (max-width: 760px) {
      .layout { display: block; }
      nav {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      main { padding: 28px 20px 56px; }
      .feature-head { display: block; }
      .badge { margin-top: 8px; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <nav>
      <div class="brand">{{ site_title }}</div>
      {{ nav }}
    </nav>
    <main>
      <header class="page-header">
        <h1>{{ page_title }}</h1>
        <p class="description">{{ page_description }}</p>
        <div class="meta">Updated last on {{ updated_last_on }} · Source commit <code>{{ short_commit }}</code></div>
        <div class="notice">{{ notice }}</div>
      </header>
      {{ content }}
    </main>
  </div>
</body>
</html>
